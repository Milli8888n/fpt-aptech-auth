spring:
  application:
    name: fpt-aptech-auth-test

  datasource:
    url: jdbc:h2:mem:authtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

  mail:
    host: localhost
    port: 1025

  thymeleaf:
    cache: false

app:
  base-url: http://localhost:8080
  totp-aes-key: FptAptechAuthSecret2026AESGCM256Key!!
