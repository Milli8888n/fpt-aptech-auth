<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-success display-4"></i>
                <h2 class="h3 mt-2 fw-bold">Thiết lập mật khẩu mới</h2>
                <p class="text-muted">Nhập mật khẩu mới thỏa mãn tiêu chuẩn an toàn</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger shadow-sm">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Lỗi</span>
            </div>

            <div class="card p-4">
                <form th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
                    <input type="hidden" th:field="*{token}">

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Mật khẩu mới</label>
                        <input th:field="*{password}" type="password" class="form-control" placeholder="••••••••••••"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" required autofocus>
                        <div class="invalid-feedback" th:errors="*{password}">Lỗi mật khẩu</div>
                        <div class="form-text small text-muted">Tối thiểu 12 ký tự, không trùng email/username, không nằm trong top 10.000 mật khẩu phổ biến.</div>
                    </div>

                    <div class="mb-4">
                        <label for="passwordConfirm" class="form-label fw-semibold">Nhập lại mật khẩu mới</label>
                        <input th:field="*{passwordConfirm}" type="password" class="form-control" placeholder="••••••••••••"
                               th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:errors="*{passwordConfirm}">Lỗi nhập lại mật khẩu</div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i> Lưu mật khẩu mới
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
