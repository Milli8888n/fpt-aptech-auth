<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-question-circle-fill text-danger display-4"></i>
                <h2 class="h3 mt-2 fw-bold">Quên mật khẩu</h2>
                <p class="text-muted">Nhận liên kết đặt lại mật khẩu an toàn</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger shadow-sm">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Lỗi</span>
            </div>

            <div th:if="${successMessage}" class="alert alert-info shadow-sm">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span th:text="${successMessage}">Thông báo</span>
            </div>

            <div class="card p-4">
                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Địa chỉ Email đăng ký</label>
                        <input id="email" name="email" type="email" class="form-control" placeholder="nhap.email@example.com" required autofocus>
                        <div class="form-text small text-muted">Liên kết đặt lại có hiệu lực trong vòng 30 phút.</div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
                        <i class="bi bi-send me-1"></i> Gửi liên kết đặt lại
                    </button>
                </form>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/login}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Quay lại trang đăng nhập</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
