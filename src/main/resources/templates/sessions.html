<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thiết bị đăng nhập')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 fw-bold mb-1"><i class="bi bi-laptop text-primary me-2"></i>Thiết bị &amp; Phiên đăng nhập</h2>
            <p class="text-muted mb-0">Quản lý các thiết bị đang đăng nhập tài khoản của bạn. Hệ thống giới hạn tối đa 2 thiết bị đồng thời.</p>
        </div>
        <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Hồ sơ cá nhân</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success shadow-sm alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-12" th:each="s : ${sessions}">
            <div class="card p-4" th:classappend="${s.current} ? 'border-primary shadow-sm' : ''">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="d-flex">
                        <div class="bg-light p-3 rounded-3 me-3 text-primary fs-3">
                            <i class="bi bi-display" th:if="${#strings.contains(s.userAgent, 'Windows') || #strings.contains(s.userAgent, 'Mac') || #strings.contains(s.userAgent, 'Linux')}"></i>
                            <i class="bi bi-phone" th:unless="${#strings.contains(s.userAgent, 'Windows') || #strings.contains(s.userAgent, 'Mac') || #strings.contains(s.userAgent, 'Linux')}"></i>
                        </div>
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <h5 class="fw-bold mb-0" th:text="${s.userAgent}">Trình duyệt Chrome trên Windows</h5>
                                <span th:if="${s.current}" class="badge bg-primary"><i class="bi bi-check2 me-1"></i>Thiết bị này</span>
                            </div>
                            <div class="text-muted small mb-2">
                                <i class="bi bi-geo-alt me-1"></i>Địa chỉ IP: <strong th:text="${s.ipAddress}">127.0.0.1</strong>
                            </div>
                            <div class="text-secondary small">
                                <span><i class="bi bi-clock me-1"></i>Đăng nhập lúc: <span th:text="${s.creationTime}">2026-10-23</span></span>
                                <span class="ms-3"><i class="bi bi-activity me-1"></i>Hoạt động gần nhất: <span th:text="${s.lastAccessTime}">Vừa xong</span></span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <form th:action="@{/sessions/revoke}" method="post">
                            <input type="hidden" name="sessionId" th:value="${s.sessionId}">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    th:text="${s.current} ? 'Đăng xuất phiên này' : 'Đăng xuất từ xa'">
                                Đăng xuất
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
