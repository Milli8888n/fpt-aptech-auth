<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mời Giảng viên hoặc Quản trị viên')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-paper-fill text-primary display-4"></i>
                <h2 class="h3 mt-2 fw-bold">Mời thành viên mới</h2>
                <p class="text-muted">Tạo tài khoản Giảng viên hoặc Quản trị viên qua email mời</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger shadow-sm">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Lỗi mời người dùng</span>
            </div>

            <div class="card p-4">
                <form th:action="@{/admin/invite}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                        <input id="email" name="email" type="email" class="form-control" th:value="${email}" placeholder="giangvien@fpt.edu.vn" required autofocus>
                        <div class="form-text small text-muted">Hệ thống sẽ gửi link mời đặt mật khẩu có hiệu lực 24 giờ tới email này.</div>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Tên đăng nhập (Username)</label>
                        <input id="username" name="username" type="text" class="form-control" th:value="${username}" placeholder="gv_tuan" required>
                    </div>

                    <div class="mb-4">
                        <label for="role" class="form-label fw-semibold">Vai trò được cấp</label>
                        <select id="role" name="role" class="form-select" required>
                            <option value="ROLE_LECTURER" th:selected="${role == 'ROLE_LECTURER'}">Giảng viên (ROLE_LECTURER)</option>
                            <option value="ROLE_ADMIN" th:selected="${role == 'ROLE_ADMIN'}">Quản trị viên (ROLE_ADMIN)</option>
                        </select>
                        <div class="form-text small text-muted">Giảng viên và Quản trị viên bắt buộc phải thiết lập 2FA (TOTP) sau khi kích hoạt.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-send-fill me-1"></i> Gửi lời mời kích hoạt
                    </button>
                </form>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/admin/users}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Quay lại danh sách quản trị</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
