<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lỗi xác thực')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card p-5 shadow-sm">
                <i class="bi bi-x-circle-fill text-danger display-1 mb-3"></i>
                <h2 class="h3 fw-bold text-danger">Xác thực không thành công</h2>
                <p class="text-muted mt-2" th:text="${errorMessage}">Liên kết xác thực không hợp lệ hoặc đã hết hạn.</p>
                <div class="alert alert-warning mt-4 text-start">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <strong>Nguyên nhân có thể do:</strong>
                    <ul class="mb-0 mt-1 small">
                        <li>Liên kết xác thực đã vượt quá thời hạn 24 giờ.</li>
                        <li>Liên kết này đã từng được sử dụng để kích hoạt trước đó.</li>
                    </ul>
                </div>
                <div class="mt-4">
                    <a th:href="@{/resend-verification}" class="btn btn-warning px-4 me-2">Gửi lại email xác thực</a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary">Về đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
