services:
  mysql:
    image: mysql:8.4
    container_name: fpt_aptech_auth_mysql
    environment:
      MYSQL_DATABASE: auth
      MYSQL_USER: auth
      MYSQL_PASSWORD: auth_pw
      MYSQL_ROOT_PASSWORD: root_pw
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "auth", "-pauth_pw"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: fpt_aptech_auth_mailpit
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI for viewing verification & reset emails
